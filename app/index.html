<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>렉시오 · 설교 작업실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webfonts" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+Hebrew:wght@400;600&family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --panel:#faf7f0; --ink:#26221d; --ink2:#5d554b; --ink3:#8d8478;
  --line:#e4ddcf; --line2:#d6cdbb; --accent:#1f4e5f; --accent2:#2f6f84; --accentSoft:#e3eef1;
  --gold:#a8814a; --goldSoft:#f5ecdc; --warn:#b5651d; --bad:#a33b3b; --good:#3d7a4f;
  --hl:#fff1c7; --sel:#e6f0f3;
  --ui:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --read:'Noto Serif KR',serif;
  --heb:'Noto Serif Hebrew','SBL Hebrew',serif; --grk:'Gentium Book Plus','Noto Serif',serif;
  --readSize:18px; --editSize:17px; --studySize:15px; --readLH:1.85; --radius:12px;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 4px 16px rgba(60,45,20,.06);
}
body.night{
  --bg:#191a1c; --paper:#222326; --panel:#1e1f22; --ink:#ebe6dc; --ink2:#bdb5a8; --ink3:#8c857a;
  --line:#34353a; --line2:#45464c; --accent:#7fb8c9; --accent2:#9ccbd9; --accentSoft:#24343a;
  --gold:#d2b07c; --goldSoft:#33291b; --hl:#4a3f1c; --sel:#253339;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}

/* 끌어서 크기 조절 */
.vsplit{position:absolute;top:0;bottom:0;left:var(--lw,33.3%);width:10px;margin-left:-5px;cursor:col-resize;z-index:5}
.vsplit:hover,.vsplit.on{background:linear-gradient(90deg,transparent 4px,var(--accent2) 4px,var(--accent2) 6px,transparent 6px)}
.main.wideLeft .vsplit,.main.noLeft .vsplit{display:none}
.sgrip{position:absolute;left:0;right:0;top:-5px;height:10px;cursor:row-resize;z-index:3}
.sgrip:hover,.sgrip.on{background:linear-gradient(transparent 4px,var(--accent2) 4px,var(--accent2) 6px,transparent 6px)}
.study.min .sgrip{display:none}
body.dragging{user-select:none;-webkit-user-select:none;cursor:col-resize}
body.dragging.row{cursor:row-resize}
@media (max-width:900px){.vsplit{display:none}}
/* 선택한 글 도구 */
.selpop{position:fixed;z-index:80;display:flex;gap:4px;background:var(--ink);padding:5px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.selpop button{border:none;background:transparent;color:var(--paper);font:inherit;font-size:13px;font-weight:600;padding:6px 10px;border-radius:7px;white-space:nowrap;cursor:pointer}
.selpop button:hover{background:rgba(255,255,255,.14)}
.selpop .sep{width:1px;background:rgba(255,255,255,.2);margin:4px 2px}
.zbtn{border:none;background:transparent;color:var(--ink3);font-size:12.5px;font-weight:700;padding:5px 7px;border-radius:7px;cursor:pointer}
.zbtn:hover{background:var(--panel);color:var(--ink)}
/* 설정 단추 */
#bSet{font-size:13.5px}
#bSet .gear{font-size:18px;line-height:1}
/* 색 테마 */
body.th-white{--bg:#f5f6f7;--paper:#ffffff;--panel:#f8f9fa;--line:#e3e5e8;--line2:#d2d6db;--goldSoft:#f6efe2}
body.th-sepia{--bg:#efe6d4;--paper:#fbf5e8;--panel:#f5ecda;--ink:#3b2f22;--ink2:#64543f;--line:#e2d4b8;--line2:#d3c19d;--accent:#7a4b26;--accent2:#965f33;--accentSoft:#f1e3d2;--sel:#f1e3d2}
body.th-green{--bg:#eef1ec;--paper:#fbfcf9;--panel:#f3f6f0;--line:#dde4d6;--line2:#c9d3c0;--accent:#2f5d46;--accent2:#3f7a5c;--accentSoft:#e2ede5;--sel:#e2ede5}
body.th-navy{--bg:#eef1f6;--paper:#fcfdff;--panel:#f3f5fa;--line:#dde2ec;--line2:#c8d0de;--accent:#24407a;--accent2:#3557a0;--accentSoft:#e2e9f6;--sel:#e2e9f6}
.themes{display:flex;gap:6px;flex-wrap:wrap}
.themes button{border:2px solid transparent;border-radius:9px;padding:6px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--panel)}
.themes button.on{border-color:var(--accent)}
.themes i{width:14px;height:14px;border-radius:50%;display:inline-block}

/* top bar */
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.bname{display:flex;flex-direction:column;line-height:1.15;font-family:var(--read);font-size:18px;letter-spacing:.02em}
.bname small{font-family:var(--ui);font-size:10.5px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-top:2px}
@media (max-width:900px){.bname small{display:none}}
body.night .brand .mark{color:#10191c}
.top .title{flex:1;min-width:0;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;color:var(--ink3);white-space:nowrap}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.status.local .dot{background:var(--gold)}
.btn{border:1px solid var(--line2);background:var(--paper);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel);border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
body.night .btn.primary{color:#0f1a1d}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:none;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--panel);color:var(--ink)}

/* layout */
.main{position:relative;height:calc(100% - 56px);display:grid;grid-template-columns:var(--lw,33.3%) 1fr}
.main.wideLeft{grid-template-columns:1fr 1fr}
.main.noLeft{grid-template-columns:0 1fr}
.main.noLeft .left{visibility:hidden}
.left{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.right{display:flex;flex-direction:column;min-width:0;min-height:0}
.mobileSwitch,.mobileSwitch.seg{display:none}
@media (max-width:900px){
  .main,.main.wideLeft{grid-template-columns:1fr}
  .main.showRight .left{display:none} .main:not(.showRight) .right{display:none}
  .mobileSwitch,.mobileSwitch.seg{display:inline-flex}
  .top .title,.hideNarrow{display:none}
}

/* left panel */
.lhead{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
select.sel{border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:6px 8px;font-size:14px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:none;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff}
body.night .seg button.on{color:#0f1a1d}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2)}
.chip.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.prim{background:var(--accent);border-color:var(--accent);color:#fff}
body.night .chip.prim{color:#0f1a1d}
.ltext sup{font-size:.6em;color:var(--ink3)}
.fn{font-family:var(--ui);font-size:.68em;color:var(--ink3);line-height:1.55;margin:2px 0 4px}
.ltext{flex:1;overflow:auto;padding:14px 18px 40px;font-family:var(--read);font-size:var(--readSize);line-height:var(--readLH);min-height:0}
.chTitle{font-family:var(--read);font-weight:700;font-size:1.15em;margin:2px 0 12px;color:var(--ink)}
.verse{padding:3px 6px;margin:0 -6px;border-radius:8px;transition:background .15s}
.verse.sel{background:var(--sel)}
.vn{font-family:var(--ui);font-size:.62em;font-weight:700;color:var(--gold);vertical-align:.35em;margin-right:5px;cursor:pointer;padding:2px 3px;border-radius:4px;user-select:none}
.vn:hover{background:var(--goldSoft)}
.w{cursor:pointer;border-radius:3px;transition:background .1s}
.w:hover{background:var(--hl)}
.w.act{background:var(--accentSoft);box-shadow:inset 0 -2px 0 var(--accent)}
.cmpv{padding:8px 0 10px;border-bottom:1px dashed var(--line)}
.cmpv.sel{background:var(--sel);margin:0 -10px;padding:8px 10px 10px;border-radius:8px}
.cmpLine{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline}
.cmpLab{font-family:var(--ui);font-size:11px;font-weight:600;color:var(--ink3);text-align:right;line-height:1.4;padding-top:.4em}
.heb{font-family:var(--heb);direction:rtl;text-align:right;font-size:1.12em}
.grk{font-family:var(--grk);font-size:1.05em}
.selbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--goldSoft);font-size:13px;flex-wrap:wrap}
.selbar b{color:var(--gold)}

.study{position:relative;border-top:1px solid var(--line2);background:var(--paper);display:flex;flex-direction:column;height:var(--sh,44%);min-height:120px;max-height:85%}
.study.min{height:40px;min-height:40px}
.study.min .sbody{display:none}
.stabs{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line)}
.stabs button.t{border:none;background:transparent;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink3);border-radius:7px}
.stabs button.t.on{color:var(--accent);background:var(--accentSoft)}
.sbody{flex:1;overflow:auto;padding:14px 16px 24px;font-size:var(--studySize);min-height:0}
.lemma{font-size:1.9em;line-height:1.3;margin:2px 0}
.xlit{color:var(--ink2);font-size:.95em}
.sn{display:inline-block;font-size:.78em;font-weight:700;color:#fff;background:var(--gold);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.def{margin:10px 0;padding:10px 12px;background:var(--panel);border-radius:9px;border:1px solid var(--line)}
.def .k{font-size:.78em;font-weight:700;color:var(--ink3);margin-bottom:2px;letter-spacing:.02em}
.usage{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.usage span{background:var(--goldSoft);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.88em}
.usage span i{font-style:normal;color:var(--gold);font-weight:700;margin-left:4px;font-size:.85em}
.occ{font-family:var(--read);font-size:1em;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.occ:hover{background:var(--panel)}
.occ b{font-family:var(--ui);font-size:.82em;color:var(--accent);margin-right:6px}
.occ mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.links a{font-size:12.5px;text-decoration:none;border:1px solid var(--line2);border-radius:7px;padding:3px 9px;color:var(--ink2);background:var(--paper)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.cmt{font-family:var(--read);font-size:1.05em;line-height:1.8}
.cmt .hl{color:var(--accent);font-weight:700}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
.empty{color:var(--ink3);text-align:center;padding:30px 14px;font-size:14px}

/* right panel */
.rscroll{flex:1;overflow:auto;min-height:0}
.rwrap{max-width:860px;margin:0 auto;padding:22px 28px 140px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.head{padding:18px 20px}
.tinput{width:100%;border:none;background:transparent;font-family:var(--read);font-size:26px;font-weight:700;padding:2px 0;outline:none;letter-spacing:-.01em}
.tinput::placeholder{color:var(--ink3);font-weight:500}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.meta label{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.meta input,.meta select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:13.5px}
.passage{display:inline-flex;align-items:center;gap:6px;background:var(--goldSoft);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent}
.passage:hover{border-color:var(--gold)}
.passage.none{color:var(--ink3);font-weight:500;background:var(--panel);border:1px dashed var(--line2)}
.bigidea{margin-top:14px}
.bigidea .lab{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.03em;margin-bottom:4px}
.bigidea textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;font-family:var(--read);font-size:16px;resize:none;outline:none;line-height:1.6}

.steps{display:flex;gap:6px;margin:18px 0 12px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px 6px 6px;font-size:13.5px;color:var(--ink2);font-weight:500}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.step.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.step.on .n{background:var(--accent);color:#fff}
.step.done .n{background:var(--gold);color:#fff}
.stepArrow{color:var(--line2)}
.summary{font-size:13px;color:var(--ink2);margin:-4px 2px 10px}
.summary b{color:var(--ink)}

.pane{padding:18px 20px}
.pane h3{margin:0 0 4px;font-size:17px}
.pane .sub{color:var(--ink3);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px 13px;text-align:left;transition:all .15s;display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--ink3);background:var(--paper)}
.opt.on{border-color:var(--accent);background:var(--accentSoft);box-shadow:0 0 0 1px var(--accent) inset}
.opt .nm{font-weight:700;font-size:14.5px}
.opt .ds{font-size:12.5px;color:var(--ink2);line-height:1.45}
.opt .tg{font-size:11.5px;color:var(--gold);font-weight:600}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.skel{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.5}
.paneFoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}

.olist{display:flex;flex-direction:column;gap:6px}
.oitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 8px 7px 10px}
.oitem.drag{opacity:.4}
.oitem.over{border-color:var(--accent);box-shadow:0 -2px 0 var(--accent)}
.handle{cursor:grab;color:var(--ink3);font-size:16px;user-select:none;padding:0 2px}
.oitem input{flex:1;border:none;background:transparent;font-weight:600;font-size:14.5px;outline:none;min-width:0}
.oitem .no{font-size:12px;color:var(--ink3);width:18px;text-align:right}
.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.blocks{display:flex;flex-direction:column;gap:14px}
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .15s}
.block.focus{border-color:var(--accent)}
.bhead{display:flex;align-items:center;gap:8px;padding:10px 14px 0}
.bno{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 7px}
body.night .bno{color:#0f1a1d}
.btitle{flex:1;border:none;background:transparent;font-weight:700;font-size:15px;outline:none;min-width:0}
.bcount{font-size:12px;color:var(--ink3);white-space:nowrap}
.bhint{font-size:12.5px;color:var(--ink3);padding:2px 14px 0}
.block textarea{display:block;width:100%;border:none;background:transparent;resize:none;outline:none;padding:10px 16px 16px;font-family:var(--read);font-size:var(--editSize);line-height:1.9;min-height:110px;overflow:hidden}
.block textarea::placeholder{color:var(--ink3);opacity:.7}
.notes{background:var(--goldSoft);border-color:transparent;box-shadow:none}
.notes .bno{background:var(--gold)}
.aibox{margin:0 14px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--accentSoft);padding:10px 12px}
.aibox .txt{white-space:pre-wrap;font-family:var(--read);font-size:15.5px;line-height:1.8;max-height:360px;overflow:auto}
.aibox .act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.menu{position:absolute;z-index:40;background:var(--paper);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:5px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:var(--panel)}

.footer{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 28px 14px}
.fbar{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{flex:1;min-width:140px}
.credit{max-width:860px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--ink3)}
.credit a{color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
.linkbtn{border:none;background:none;padding:0 2px;font-size:11.5px;color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
.meter .bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .3s}
.meter .bar i.warn{background:var(--warn)} .meter .bar i.bad{background:var(--bad)}
.meter .lbl{font-size:12.5px;color:var(--ink2);margin-top:4px}
.meter .lbl b{color:var(--ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.38);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--paper);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mhead h2{margin:0;font-size:17px;flex:1}
.mbody{padding:16px 20px;overflow:auto}
.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.flist{display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel)}
.fitem .nm{flex:1;font-weight:600}
.kind{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--line);color:var(--ink2)}
.kind.s{background:var(--accentSoft);color:var(--accent)} .kind.c{background:var(--goldSoft);color:var(--gold)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:26px;text-align:center;background:var(--panel);margin-bottom:14px}
.drop.over{border-color:var(--accent);background:var(--accentSoft)}
.slist .si{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer}
.slist .si:hover{background:var(--panel)}
.slist .si .t{flex:1;min-width:0}
.slist .si .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .si .t span{font-size:12.5px;color:var(--ink3)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow .l{font-weight:600}
.setrow .l small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
textarea.code{width:100%;height:200px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line2);border-radius:8px;padding:8px;background:var(--panel)}

/* welcome */
.welcome{padding:26px 22px;font-family:var(--ui);font-size:14px;line-height:1.7}
.welcome h2{font-family:var(--read);font-size:21px;margin:0 0 6px}
.welcome ol{padding-left:18px;color:var(--ink2)}
.welcome .rec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px}

/* pulpit */
.pulpit{position:fixed;inset:0;z-index:60;background:#fbf8f1;color:#1d1a16;overflow:auto}
.pulpit.dark{background:#111;color:#eee}
.pulpit .pbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 18px;background:inherit;border-bottom:1px solid rgba(128,128,128,.25)}
.pulpit .pbar .sp{flex:1;font-weight:600;font-size:14px;opacity:.7}
.pulpit .pdoc{max-width:900px;margin:0 auto;padding:30px 36px 120px;font-family:var(--read);line-height:2}
.pulpit h1{font-size:1.5em;margin:0 0 .2em}
.pulpit .pp{opacity:.65;font-size:.8em;margin-bottom:1.4em;font-family:var(--ui)}
.pulpit h4{font-family:var(--ui);font-size:.62em;letter-spacing:.06em;opacity:.55;margin:1.8em 0 .3em;text-transform:none}
.pulpit .pt{white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:90;box-shadow:0 6px 24px rgba(0,0,0,.2);transition:opacity .3s}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 휴대폰: 위쪽 단추가 화면 밖으로 나가지 않게 */

const IDX={ready:false,building:false,occ:{},ko:{},label:null};
function parseTagged(t){
  const out=[];const re=/<W([HG])\s*(\d+)[a-z]?[^>]*>/g;let last=0,m;
  while((m=re.exec(t))){out.push({w:t.slice(last,m.index),s:m[1]+(+m[2])});last=re.lastIndex}
  if(last<t.length)out.push({w:t.slice(last),s:null});return out;
}
const cleanTagged=t=>t.replace(/<W[^>]*>/g,"");
async function buildIndex(){
  const it=LIB.find(x=>x.kind==="s");if(!it||IDX.building||(IDX.ready&&IDX.label===it.label))return;
  IDX.building=true;if(!isOpen(it))await need();await wait(30);if(!isOpen(it)){IDX.building=false;return}
  const occ={},ko={};
  const rows=q(it,"select book,chapter,verse,btext from Bible");
  for(const [b,c,v,t] of rows){
    for(const tk of parseTagged(t||"")){
      if(!tk.s||/^[HG]0$/.test(tk.s))continue;
      (occ[tk.s]||(occ[tk.s]=[])).push(b*1000000+c*1000+v);
      const w=tk.w.trim().replace(/[.,!?;:"'“”‘’()「」\[\]·]/g,"");
      if(w){const k=ko[tk.s]||(ko[tk.s]={});k[w]=(k[w]||0)+1}
    }
  }
  for(const k in occ)occ[k]=[...new Set(occ[k])];
  Object.assign(IDX,{occ,ko,ready:true,building:false,label:it.label});
}

function linkify(h){return h.replace(/\b([HG])(\d{1,5})\b/g,(m,a,b)=>`<a href="javascript:void 0" data-sn="${a}${+b}">${m}</a>`)}
function sanitize(html){
  const doc=new DOMParser().parseFromString("<div>"+html+"</div>","text/html");
  const ok={B:"b",STRONG:"b",I:"i",EM:"i",U:"u",BR:"br",P:"p",SUP:"sup",SUB:"sub",UL:"ul",OL:"ol",LI:"li"};
  function walk(n){let o="";for(const c of n.childNodes){if(c.nodeType===3)o+=esc(c.textContent);else if(c.nodeType===1){const tg=c.tagName;if(tg==="SCRIPT"||tg==="STYLE")continue;if(tg==="FONT"){o+=`<span class="hl">${walk(c)}</span>`;continue}const t=ok[tg];if(t==="br")o+="<br>";else if(t)o+=`<${t}>${walk(c)}</${t}>`;else o+=walk(c)}}return o}
  return walk(doc.body.firstChild);
}

async function addFiles(fl){
  if(!SQL){await initSQL();if(!SQL)return toast("데이터 엔진을 불러오지 못했습니다")}
  let n=0;
  for(const f of fl){
    if(!/\.(bdb|sdb|cdb)$/i.test(f.name))continue;
    const bytes=await f.arrayBuffer();
    const it={name:f.name,label:labelOf(f.name),kind:kindOf(f.name),size:f.size,bytes};
    try{const d=new SQL.Database(new Uint8Array(bytes));d.exec("select count(*) from Bible");d.close()}catch(e){toast(labelOf(f.name)+": 읽을 수 없는 파일");continue}
    it.bytes=null;
    const ok=await IDB.put({name:it.name,label:it.label,kind:it.kind,size:it.size,bytes});
    if(!ok){toast(it.label+": 저장 공간이 부족해 넣지 못했습니다",3500);continue}
    const i=LIB.findIndex(x=>x.label===it.label);if(i>=0){const o=LIB[i];try{o.db&&o.db.close()}catch(e){}if(o.name!==it.name)await IDB.del(o.name);LIB.splice(i,1,it)}else LIB.push(it);
    n++;if(fl.length>3)toast(`넣는 중… ${n}개`,900);
  }
  LIB.sort(sortLib);saveMeta();
  if(n&&window.LX_onFilesAdded)window.LX_onFilesAdded(fl);
  if(n){toast(n+"개 자료를 넣었습니다");if(LIB.some(x=>x.kind==="s"))buildIndex().then(()=>{if(ST.word)renderStudy()});renderLeft();if($("#setModal"))openSettings()}
}

function saveLocal(){ls.set("sw.s."+SER.id,SER);const i=LIST.findIndex(x=>x.id===SER.id);const m=metaOf(SER);if(i>=0)LIST[i]=m;else LIST.unshift(m);ls.set("sw.list",LIST);ls.set("sw.cur",SER.id);if(!CAP.db)setStatus("local")}
async function saveRemote(){
  if(!CAP.db||!CAP.uid)return;
  if(dbBusy){dbPending=true;return}
  dbBusy=true;
  try{await CAP.db.collection("data/users/"+CAP.uid).doc("s_"+SER.id).set(JSON.parse(JSON.stringify(SER)));setStatus("synced")}catch(e){console.warn(e);setStatus("local")}
  dbBusy=false;if(dbPending){dbPending=false;saveRemote()}
}
function normDocs(res){if(!res)return[];const arr=Array.isArray(res)?res:(res.docs||res.items||res.rows||res.results||[]);return arr.map(d=>{const data=typeof d.data==="function"?d.data():(d.data!==undefined?d.data:(d.value!==undefined?d.value:d));return{id:d.id||d.key||(data&&data.id),data}})}
function normDoc(v){if(!v)return null;if(typeof v.data==="function")return v.data();if(v.exists===false)return null;if(v.data!==undefined&&typeof v.data==="object")return v.data;return v}
async function pullRemote(){
  if(!CAP.db||!CAP.uid)return;
  try{
    const docs=normDocs(await CAP.db.collection("data/users/"+CAP.uid).get());
    let changed=false;
    for(const d of docs){const s=d.data;if(!s||!s.id||!Array.isArray(s.blocks))continue;const loc=ls.get("sw.s."+s.id,null);
      if(!loc||(s.updated||0)>(loc.updated||0)){ls.set("sw.s."+s.id,s);const i=LIST.findIndex(x=>x.id===s.id);const m=metaOf(s);if(i>=0)LIST[i]=m;else LIST.push(m);changed=true;if(SER&&SER.id===s.id&&s.updated>SER.updated){SER=s;renderRight()}}
      else if(loc&&(loc.updated||0)>(s.updated||0)){/* 이 기기가 최신 → 올리기 */try{await CAP.db.collection("data/users/"+CAP.uid).doc("s_"+loc.id).set(loc)}catch(e){}}
    }
    // 로컬에만 있는 설교 올리기
    const remoteIds=new Set(docs.map(d=>d.data&&d.data.id));
    for(const m of LIST){if(!remoteIds.has(m.id)){const loc=ls.get("sw.s."+m.id,null);if(loc)try{await CAP.db.collection("data/users/"+CAP.uid).doc("s_"+m.id).set(loc)}catch(e){}}}
    if(changed){LIST.sort((a,b)=>(b.updated||0)-(a.updated||0));ls.set("sw.list",LIST)}
    setStatus("synced");
  }catch(e){console.warn("동기화 실패",e);setStatus("local")}
}
function setStatus(k){const el=$("#status");if(!el)return;el.classList.toggle("local",k!=="synced");el.innerHTML=`<span class="dot"></span>`+(k==="saving"?"저장 중…":k==="synced"?(window.LX_HOST?"저장됨 · 구글 드라이브":"저장됨 · 맥·아이패드 동기화"):IS_APP?"저장됨 · 이 맥":"저장됨 · 이 기기")}

function applyStruct(id){

  // 같은 이름의 블록에 이미 쓴 글을 옮기고, 나머지는 끝에 보존
  for(const o of old){const f=fresh.find(x=>x.title===o.title&&!x.text);if(f)f.text=o.text;else fresh.push(o)}
  SER.blocks=fresh;
}

  if(!ta){const all=[...document.querySelectorAll(".block textarea")];ta=all.find(x=>!x.value.trim())||all[all.length-1]||null;if(ta){lastTA=ta;lastPos=ta.value.length}}
  if(!ta){appendNote(txt);return}
  const pos=document.activeElement===ta?ta.selectionStart:(lastPos??ta.value.length);
  const before=ta.value.slice(0,pos),after=ta.value.slice(pos);
  const sep=before&&!/\s$/.test(before)?" ":"";
  ta.value=before+sep+txt+after;ta.dispatchEvent(new Event("input"));
  lastPos=pos+sep.length+txt.length;
  const blk=ta.closest(".block");blk&&blk.scrollIntoView({block:"nearest",behavior:"smooth"});

const SYS_DEFAULT=`당신은 개혁주의·복음주의 전통에 선 한국 목회자의 설교 준비를 돕는 연구 조교입니다.
원칙: 성경 본문의 문맥과 저자 의도를 먼저 존중하고(문법적·역사적 해석), 그리스도 중심으로 해석하며, 웨스트민스터 신앙고백과 요리문답에 어긋나지 않게 씁니다.
성경 인용은 개역개정 표현을 따르고, 원어를 말할 때는 주어진 원어 자료 범위 안에서만 말하며 확실하지 않으면 그렇다고 밝힙니다. 지어낸 예화를 실화처럼 쓰지 말고, 예화는 '예화 아이디어'로 표시합니다.
한국 교회 강단의 경어체(~합니다, ~입니다)로, 쉽고 따뜻하며 선명하게 씁니다. 답은 바로 본문만 내고 머리말이나 덧붙이는 설명은 쓰지 않습니다.`;
const sysText=()=>(S.aiGuide&&S.aiGuide.trim())||SYS_DEFAULT;
function ctxText(){
  const p=SER.passage;let t=`[설교 정보]\n제목: ${SER.title||"(미정)"}\n종류: ${typeName()||"-"} / 구조: ${structName()||"-"} / 예배: ${SER.place||"-"} / 목표 ${SER.minutes}분 (약 ${(SER.minutes*S.cpm).toLocaleString()}자)\n중심 메시지: ${SER.bigIdea||"(미정)"}\n`;
  if(p&&LIB.length){t+=`\n[설교 본문: ${p.label} (개역개정)]\n`;const label=(LIB.find(x=>/개역개정/.test(x.label)&&x.kind!=="c")||{}).label||ST.prim;for(let v=p.v1;v<=p.v2;v++){const s=verseText(label,p.b,p.c,v);if(s)t+=`${v} ${s}\n`}}
  else if(p)t+=`\n[설교 본문] ${p.label}\n`;
  if(SER.notes)t+=`\n[목사님의 연구 메모]\n${SER.notes.slice(0,4000)}\n`;
  t+=`\n[설교 순서와 현재 원고]\n`+SER.blocks.map((b,i)=>`${i+1}. ${b.title}${b.text?`\n${b.text.slice(0,1500)}`:" (아직 비어 있음)"}`).join("\n\n");
  return t;
}

let aiCtl=null;
async function aiRun(kind,b){
  if(!CAP.ai)return;
  const slot=b?document.querySelector(`.block[data-id="${b.id}"] .aiSlot`):null;
  let host=slot;if(!host){host=document.createElement("div");$("#blocks").before(host)}
  host.innerHTML=`<div class="aibox"><div class="small" style="font-weight:700;color:var(--accent);margin-bottom:4px">✦ ${kind==="outline"?"전체 개요 제안":AI_TASKS[kind][0]}${b?" · "+esc(b.title):""}${CAP.aiName?` <span class="muted" style="font-weight:400">· ${esc(CAP.aiName)}</span>`:""}</div><div class="txt"><span class="spin"></span> 생각하는 중…</div><div class="act"></div></div>`;
  const txt=host.querySelector(".txt"),act=host.querySelector(".act");
  const task=kind==="outline"?`설교 순서의 각 블록에 들어갈 핵심 내용을 블록 제목별로 2~4줄씩 개요로 제안해 주세요. 중심 메시지가 비어 있으면 맨 앞에 '중심 메시지 제안: ...'을 한 줄로 먼저 쓰세요.`:`[지금 작업할 블록] ${b.title}\n${b.hint?"(블록 안내: "+b.hint+")\n":""}${b.text?"[이 블록의 현재 원고]\n"+b.text+"\n":""}\n[요청] ${AI_TASKS[kind][1]}`;
  try{aiCtl&&aiCtl.abort()}catch(e){}
  aiCtl=new AbortController();
  try{
    const res=await CAP.ai(`${sysText()}\n\n${ctxText()}\n\n${task}`,{signal:aiCtl.signal,onText:({text})=>{txt.textContent=text},modelTier:"default",cache:false});
    txt.textContent=res.text;
    const btns=[];
    if(b){btns.push(`<button class="btn sm primary" data-a="ins">커서 위치에 넣기</button>`);if(b.text&&(kind==="polish"||kind==="shorten"))btns.push(`<button class="btn sm" data-a="rep">원고를 이것으로 바꾸기</button>`);else if(!b.text&&kind==="draft")btns.push(`<button class="btn sm" data-a="rep">이 블록에 채우기</button>`)}
    btns.push(`<button class="btn sm" data-a="note">연구 메모로</button>`,`<button class="btn sm ghost" data-a="x">닫기</button>`);
    act.innerHTML=btns.join("");
    act.onclick=e=>{const a=e.target.dataset.a;if(!a)return;const t=res.text.trim();
      if(a==="ins"){const ta=document.querySelector(`.block[data-id="${b.id}"] textarea`);lastTA=ta;if(lastPos==null||lastTA!==ta)lastPos=ta.value.length;insertText(t)}
      else if(a==="rep"){const old=b.text;b.text=t;touch();renderBlocks();renderFooter();toast("바꿨습니다");b._undo=old}
      else if(a==="note"){appendNote(t)}
      host.innerHTML="";if(!slot)host.remove()};
  }catch(e){
    const c=e&&e.code;txt.textContent=c==="not_granted"?"AI 사용이 허락되지 않았습니다.":c==="rate_limited"?"요청이 많아 잠시 쉬어야 합니다. 조금 뒤에 다시 눌러 주세요.":c==="aborted"||e.name==="AbortError"?"멈췄습니다.":"답을 받지 못했습니다: "+(e&&e.message||e);
    act.innerHTML=`<button class="btn sm ghost" data-a="x">닫기</button>`;act.onclick=()=>{host.innerHTML="";if(!slot)host.remove()};
  }
}

const WEBAI={
  NAMES:{gemini:"Gemini",claude:"Claude API",openai:"ChatGPT API"},DEF:{gemini:"gemini-flash-latest",claude:"claude-sonnet-5-5",openai:"gpt-5-mini"},
  c(){return Object.assign({provider:"",models:{},keys:{}},ls.get("sw.ai",{}))},
  pub(){const c=this.c();const has={};for(const k in this.NAMES)has[k]=!!c.keys[k];return{provider:c.provider,models:Object.assign({},this.DEF,c.models),hasKey:has,names:this.NAMES}},
  async get(){return this.pub()},
  async set(o){const c=this.c();if("provider" in o)c.provider=o.provider;if(o.p&&o.model!==undefined)c.models[o.p]=o.model;if(o.p&&o.key!==undefined){if(o.key)c.keys[o.p]=o.key.trim();else delete c.keys[o.p]}ls.set("sw.ai",c);return this.pub()},
  async call(url,opt){const r=await fetch(url,opt);const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}if(!r.ok){const m=(j&&(j.error&&(j.error.message||j.error.type)||j.message))||t.slice(0,200);throw new Error((r.status===401||r.status===403?"키가 맞지 않거나 권한이 없습니다. ":r.status===429?"사용 한도에 걸렸습니다. 잠시 뒤 다시 해 보세요. ":r.status===404?"모델 이름을 확인해 주세요. ":"")+"("+r.status+") "+m)}return j},
  async ask(prompt){try{const c=this.c(),p=c.provider,key=c.keys[p],model=(c.models[p]||this.DEF[p]);if(!p||!key)throw new Error("AI가 연결되어 있지 않습니다.");
    if(p==="gemini"){const j=await this.call(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:8192}})});const t=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(x=>x.text||"").join("");if(!t)throw new Error("답이 비어 있습니다");return{text:t}}
    if(p==="claude"){const j=await this.call("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:8000,messages:[{role:"user",content:prompt}]})});return{text:(j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("")}}
    if(p==="openai"){const j=await this.call("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+key},body:JSON.stringify({model,messages:[{role:"user",content:prompt}]})});return{text:((((j.choices||[])[0]||{}).message)||{}).content||""}}
    throw new Error("알 수 없는 AI입니다.")}catch(e){return{error:String(e.message||e)}}},
  async models(p){try{const key=this.c().keys[p];if(!key)throw new Error("먼저 키를 저장해 주세요.");
    if(p==="gemini"){const j=await this.call(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`);return{list:(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,"")).filter(n=>/gemini/.test(n))}}
    if(p==="claude"){const j=await this.call("https://api.anthropic.com/v1/models?limit=100",{headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}});return{list:(j.data||[]).map(m=>m.id)}}
    if(p==="openai"){const j=await this.call("https://api.openai.com/v1/models",{headers:{authorization:"Bearer "+key}});return{list:(j.data||[]).map(m=>m.id).filter(id=>/^(gpt|o\d|chatgpt)/.test(id)&&!/audio|realtime|tts|transcribe|image|search/.test(id)).sort()}}

};

function plainText(){
  const p=SER.passage;let t=`${SER.title||"제목 없는 설교"}\n${p?"본문: "+p.label+"\n":""}${SER.date?SER.date:""}${SER.place?" · "+SER.place:""}\n`;
  if(p&&LIB.length){const label=(LIB.find(x=>/개역개정/.test(x.label)&&x.kind!=="c")||{}).label||ST.prim;const ts=[];for(let v=p.v1;v<=p.v2;v++){const s=verseText(label,p.b,p.c,v);if(s)ts.push(v+" "+s)}if(ts.length)t+="\n"+ts.join("\n")+"\n"}
  if(SER.bigIdea)t+=`\n중심 메시지: ${SER.bigIdea}\n`;

}

function bindSelTools(){
  const L=$("#left");
  const fromSel=()=>{const s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount)return hideSelPop();const r=s.getRangeAt(0).getBoundingClientRect();if(!r.width&&!r.height)return;showSelPop(r.left+r.width/2,r.top)};
  L.addEventListener("mouseup",()=>setTimeout(fromSel,10));
  L.addEventListener("touchend",()=>setTimeout(fromSel,350));
  L.addEventListener("contextmenu",e=>{if(selInfo()){e.preventDefault();showSelPop(e.clientX,e.clientY+40)}});
  document.addEventListener("selectionchange",()=>{const s=window.getSelection();if(!s||s.isCollapsed)setTimeout(()=>{const t=window.getSelection();if(!t||t.isCollapsed)hideSelPop()},150)});
  L.addEventListener("scroll",hideSelPop,true);
  document.addEventListener("mousedown",e=>{if(!e.target.closest(".selpop")&&!e.target.closest("#left"))hideSelPop()},true);
  document.addEventListener("keydown",e=>{if(window.lexioApp)return;if((e.metaKey||e.ctrlKey)&&e.shiftKey&&!e.altKey){const k=e.key.toLowerCase();if(k==="m"){e.preventDefault();selToNote()}else if(k==="i"){e.preventDefault();selToSermon()}}});
}
function dragResize(handle,onMove,row){
  handle.addEventListener("pointerdown",e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);handle.classList.add("on");document.body.classList.add("dragging");document.body.classList.toggle("row",!!row);
    const mv=ev=>onMove(ev);const up=()=>{handle.classList.remove("on");document.body.classList.remove("dragging","row");handle.removeEventListener("pointermove",mv);handle.removeEventListener("pointerup",up);ls.set("sw.settings",S)};
    handle.addEventListener("pointermove",mv);handle.addEventListener("pointerup",up)});
}
function bindSplit(){
  const m=$("#main");if(!m||$("#vsplit"))return;const h=document.createElement("div");h.className="vsplit";h.id="vsplit";h.title="끌어서 너비 조절 · 두 번 누르면 처음대로";m.appendChild(h);
  dragResize(h,e=>{const r=m.getBoundingClientRect();S.leftW=Math.round(Math.max(18,Math.min(70,(e.clientX-r.left)/r.width*100))*10)/10;S.leftMode=0;document.documentElement.style.setProperty("--lw",S.leftW+"%");m.classList.remove("wideLeft","noLeft")});
  h.ondblclick=()=>{S.leftW=33.3;applySettings()};
}
function bindStudyGrip(){
  const g=$("#sgrip"),L=$("#left");if(!g)return;
  dragResize(g,e=>{const r=L.getBoundingClientRect();S.studyH=Math.round(Math.max(15,Math.min(85,(r.bottom-e.clientY)/r.height*100)));document.documentElement.style.setProperty("--sh",S.studyH+"%")},true);
  g.ondblclick=()=>{S.studyH=44;applySettings()};
}

/* ============ 시작 ============ */
async function start(){
  applySettings();bindSplit();bindSelTools();
  if(window.lexioApp&&window.lexioApp.onMenu)window.lexioApp.onMenu(k=>{if(k==="selNote")selToNote();if(k==="selIns")selToSermon();if(k==="pulpit")openPulpit();if(k==="settings")openSettings()});
  $("#bList").onclick=openList;$("#bExport").onclick=openExport;$("#bPulpit").onclick=openPulpit;$("#bSet").onclick=openSettings;
  $("#bLeft").onclick=()=>{S.leftMode=(S.leftMode+1)%3;applySettings()};
  $("#mL").onclick=()=>showRight(false);$("#mR").onclick=()=>showRight(true);
  $("#bakIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importBackup(f)};
  $("#fileIn").onchange=e=>{const fl=[...e.target.files];e.target.value="";addFiles(fl)};
  document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select"))return;if(e.key==="ArrowLeft"&&LIB.length)step(-1);if(e.key==="ArrowRight"&&LIB.length)step(1)});
  // 설교 먼저 띄우기
  const cur=ls.get("sw.cur",null);SER=(cur&&ls.get("sw.s."+cur,null))||newSermon();if(!LIST.find(x=>x.id===SER.id))saveLocal();
  renderRight();$("#topTitle").textContent=SER.title||"제목 없는 설교";setStatus("local");
  $("#left").innerHTML=`<div class="empty" style="margin-top:40px"><span class="spin"></span> 성경 자료를 여는 중…</div>`;
  loadLex().then(()=>{if(ST.word)renderStudy()});
  await initSQL();
  await IDB.open();
  let meta=ls.get("sw.libmeta",null);
  if(!meta){const saved=await IDB.all();meta=saved.map(f=>({name:f.name,label:f.label||labelOf(f.name),kind:f.kind||kindOf(f.name),size:f.size}))}
  for(const f of meta){const label=nfc(f.label);if(!LIB.some(x=>x.label===label))LIB.push({name:f.name,label,kind:f.kind,size:f.size,bytes:null,db:null})}
  ST.prim=nfc(ST.prim);ST.cmp=(ST.cmp||[]).map(nfc);ST.cmt=nfc(ST.cmt);FIND.label=nfc(FIND.label);
  LIB.sort(sortLib);saveMeta();
  renderLeft();
  if(LIB.some(x=>x.kind==="s"))setTimeout(()=>buildIndex().then(()=>{if(ST.word)renderStudy()}),300);
  // Claude 기능
  cap("db").then(async d=>{if(!d)return;const u=await cap("user");let id=null;try{id=u&&await u.id()}catch(e){}if(!id)return;CAP.db=d;CAP.uid=id;await pullRemote();
    // 새 기기에서 자동으로 생긴 빈 설교는 올리지 않고, 가장 최근 설교를 엽니다
    const blank=x=>x&&!x.title&&!x.passage&&!x.bigIdea&&!x.notes&&!x.type&&!(x.blocks||[]).some(b=>(b.text||"").trim());
    if(blank(SER)&&LIST.some(m=>m.id!==SER.id)){const old=SER.id;LIST=LIST.filter(m=>m.id!==old);ls.set("sw.list",LIST);try{localStorage.removeItem("sw.s."+old)}catch(e){}LIST.sort((a,b)=>(b.updated||0)-(a.updated||0));loadSermon(LIST[0].id);setStatus("synced")}else saveRemote()});
  cap("downloads").then(d=>{CAP.dl=d});
  cap("sample").then(a=>{if(a){CAP.ai=a;CAP.aiName="Claude";if(SER.stage===4)renderStage()}else if(keyAI())initAppAI()});
  if(IS_APP)initAppAI();setDocTitle();
}
start();
</script>
<script>
// 렉시오 맥 앱: 새 버전 알림 (홈페이지 version.json) · 도움말 메뉴의 '새 버전 확인'
(function () {
  var A = window.lexioApp; if (!A || !A.fetchJson) return;
  var HOME = 'https://shepherdsdesk.github.io/lexio/', CUR = A.version || '';
  function num(v) { return String(v || '').split('.').map(function (n) { return parseInt(n, 10) || 0; }); }
  function newer(a, b) { var x = num(a), y = num(b); for (var i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function say(m) { if (typeof toast === 'function') toast(m, 3200); }
  function dl(info) { A.openUrl((info && info.mac) || HOME + 'install.html#update'); }
  function notes(info) {
    var o = document.createElement('div'); o.className = 'lx-upd-ov';
    o.innerHTML = '<div class="lx-upd-box"><h3>새 버전 ' + esc(info.version) + (info.date ? ' <small>' + esc(info.date) + '</small>' : '') + '</h3><p class="lx-dim">지금 쓰시는 버전: ' + esc(CUR) + '</p><ul>' + (info.notes || []).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul><p class="lx-dim">새 DMG를 받아 응용 프로그램 폴더에 덮어쓰면 됩니다. 원고와 성경 자료는 그대로 남습니다.</p><div class="lx-row"><button class="btn sm ghost" data-k="help">설치 도움말</button><span style="flex:1"></span><button class="btn sm" data-k="close">닫기</button><button class="btn sm primary" data-k="get">내려받기</button></div></div>';
    o.addEventListener('click', function (e) { var k = e.target.getAttribute && e.target.getAttribute('data-k'); if (e.target === o || k === 'close') o.remove(); if (k === 'get') { dl(info); o.remove(); } if (k === 'help') A.openUrl(HOME + 'install.html#update'); });
    document.body.appendChild(o);
  }
  function banner(info) {
    try { if (localStorage.getItem('lexio.updHide') === info.version) return; } catch (_) {}
    if (document.querySelector('.lx-upd')) return;
    var d = document.createElement('div'); d.className = 'lx-upd';
    d.innerHTML = '<b>새 버전 ' + esc(info.version) + '이 나왔습니다</b><span class="lx-dim">' + esc((info.notes || [])[0] || '') + '</span><button class="btn sm" data-k="notes">무엇이 바뀌었나</button><button class="btn sm primary" data-k="get">내려받기</button><button class="btn sm ghost" data-k="x" title="이 버전 알림 닫기">✕</button>';
    d.addEventListener('click', function (e) { var k = e.target.getAttribute('data-k'); if (k === 'notes') notes(info); if (k === 'get') dl(info); if (k === 'x') { try { localStorage.setItem('lexio.updHide', info.version); } catch (_) {} d.remove(); } });
    document.body.appendChild(d);
  }
  async function check(manual) {
    var info = null; try { info = await A.fetchJson(HOME + 'version.json'); } catch (_) {}
    if (!info || !info.version) { if (manual) say('홈페이지에 연결하지 못했습니다 · 인터넷 연결을 확인해 주세요'); return; }
    if (newer(info.version, CUR)) { if (manual) notes(info); else banner(info); }
    else if (manual) say('지금 쓰시는 버전이 최신입니다 (' + CUR + ')');
  }
  window.lexioCheckUpdate = check;
  A.onMenu(function (k) { if (k === 'update') check(true); });
  setTimeout(function () { check(false); }, 4000);
  setInterval(function () { check(false); }, 6 * 3600e3);
  var st = document.createElement('style');
  st.textContent = '.lx-upd{position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 32px);background:#eaf2ec;border:1px solid #cfe0d3;border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 10px 30px rgba(30,50,35,.15);font-size:13.5px}.lx-upd b{color:#2e5b3e}.lx-dim{color:#777;font-size:13px}.lx-upd-ov{position:fixed;inset:0;z-index:70;background:rgba(20,20,15,.35);display:grid;place-items:center}.lx-upd-box{background:#fff;border-radius:14px;padding:22px 24px;max-width:480px;width:calc(100vw - 40px);box-shadow:0 20px 60px rgba(0,0,0,.25)}.lx-upd-box h3{margin:0 0 4px;font-size:18px}.lx-upd-box h3 small{font-weight:400;color:#888;font-size:13px}.lx-upd-box ul{margin:12px 0;padding-left:1.2em;display:grid;gap:6px;font-size:14px}.lx-row{display:flex;gap:6px;align-items:center;margin-top:14px}';
  document.head.appendChild(st);
})();
</script>
